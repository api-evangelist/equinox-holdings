name: Equinox Holdings
description: |-
  Equinox Holdings is a privately held luxury lifestyle and fitness company majority-owned by
  Related Companies. Its portfolio spans high-end fitness clubs (Equinox), boutique indoor
  cycling (SoulCycle), yoga (Pure Yoga), value-tier gyms (Blink Fitness), luxury hospitality
  (Equinox Hotels), and a consumer streaming fitness app (Equinox+). The group operates more
  than 300 club facilities across the United States, Canada, and the United Kingdom and is
  positioned around the tagline "It's not fitness. It's life." Equinox Holdings does not
  publish a public developer program, OpenAPI specification, SDKs, or a GitHub organization;
  all consumer experiences are delivered through its native iOS/Android apps and websites,
  with no documented partner or open API surface.
