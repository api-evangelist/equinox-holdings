  notes: |-
    Equinox Holdings is consumer-only across all brands. The Equinox+ mobile app
    necessarily exercises internal HTTPS APIs for class metadata, reservations, payments,
    and streaming, but none of these are publicly documented, no SDKs are published, and
    there is no developer portal, OpenAPI specification, public GitHub organization, or
    partner-API program. This repo therefore intentionally contains no openapi/, capabilities/,
    json-schema/, examples/, rules/, plans/, rate-limits/, or finops/ artifacts — per the
    pipeline rule against creating empty/placeholder specs.
